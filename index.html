<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カジノランキング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #111318;
    --surface: #ffffff;
    --surface2: #f4f6f9;
    --border: #e2e8f0;
    --text: #1a202c;
    --text-sub: #4a5568;
    --text-dim: #a0aec0;
    --header-text: #f1f5f9;
    --header-sub: #94a3b8;
    --c1: #5a67d8;
    --c2: #3182ce;
    --c3: #38a169;
    --c4: #d69e2e;
    --c5: #d53f8c;
    --good: #38a169;
    --bad: #e53e3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 32px 24px 64px;
  }

  .header {
    max-width: 1100px;
    margin: 0 auto 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .header-left h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--header-text);
    letter-spacing: -0.3px;
  }

  .header-left p {
    font-size: 13px;
    color: var(--header-sub);
    margin-top: 4px;
  }

  .updated {
    font-size: 13px;
    color: var(--header-sub);
    background: rgba(255,255,255,0.07);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .tiles {
    max-width: 1100px;
    margin: 0 auto 20px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }

  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } }

  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    border-top: 3px solid var(--c1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }

  .tile:nth-child(1) { border-top-color: var(--c1); }
  .tile:nth-child(2) { border-top-color: var(--c2); }
  .tile:nth-child(3) { border-top-color: var(--c3); }
  .tile:nth-child(4) { border-top-color: var(--c4); }
  .tile:nth-child(5) { border-top-color: var(--c5); }

  .tile-name {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 500;
    margin-bottom: 12px;
    line-height: 1.4;
    min-height: 2.8em;
  }

  .tile-rank {
    font-family: 'Inter', sans-serif;
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .tile-rank.out {
    font-size: 18px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .tile-delta {
    font-size: 13px;
    font-weight: 600;
    margin-top: 8px;
  }

  .delta-up   { color: var(--good); }
  .delta-down { color: var(--bad); }
  .delta-flat { color: var(--text-dim); }

  .card {
    max-width: 1100px;
    margin: 0 auto 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .chart-wrap {
    position: relative;
    height: 280px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    text-align: left;
    padding: 11px 14px;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    background: var(--surface2);
  }

  th:first-child { border-radius: 6px 0 0 0; }
  th:last-child  { border-radius: 0 6px 0 0; }

  td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  td:first-child {
    color: var(--text-sub);
    font-weight: 500;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .rank-out { color: var(--text-dim); }

  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    flex-shrink: 0;
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
  }

  .error-msg {
    background: #fff5f5;
    border: 1px solid #fed7d7;
    border-radius: 8px;
    padding: 16px;
    color: #c53030;
    font-size: 13px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Google Play カジノ有料ランキング</h1>
    <p>コムシード株式会社 5タイトル｜毎日 09:00 JST 自動取得</p>
  </div>
  <div class="updated" id="updated">読み込み中...</div>
</div>

<div id="tiles" class="tiles">
  <div class="loading" style="grid-column:1/-1">データ取得中...</div>
</div>

<div class="card">
  <div class="card-title">ランキング推移（直近30日）</div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="card">
  <div class="card-title">データ一覧</div>
  <div class="table-wrap">
    <table id="table">
      <tbody><tr><td colspan="7" class="loading">読み込み中...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const SPREADSHEET_ID = '1gjmiYLcS2S2HEzdvafeiPJPbeeZiKtfUQ1QKYsXpYpM';
const SHEET_NAME = 'ランキング推移';

const APPS = [
  { name: 'スマスロ 新鬼武者3',          color: '#5a67d8' },
  { name: 'P戦国乙女7',                  color: '#3182ce' },
  { name: 'パチスロ ヴァルヴレイヴ2',    color: '#38a169' },
  { name: 'パチスロ かぐや様',           color: '#e07b00' },
  { name: 'からくりサーカス2 魔王ver.',  color: '#d53f8c' },
];

function rankLabel(v) {
  if (v === '圏外' || v === '' || v == null) return '圏外';
  const n = parseInt(v);
  return isNaN(n) ? '圏外' : n;
}

function deltaLabel(cur, prev) {
  if (cur === '圏外' || prev === '圏外' || cur == null || prev == null) return null;
  const diff = parseInt(prev) - parseInt(cur);
  if (isNaN(diff) || diff === 0) return { text: '±0', cls: 'delta-flat' };
  if (diff > 0) return { text: '▲' + diff + ' 上昇', cls: 'delta-up' };
  return { text: '▼' + Math.abs(diff) + ' 下降', cls: 'delta-down' };
}

async function loadData() {
  const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);

  const rows = json.table.rows.map(r => r.c.map(c => {
    if (!c || c.v === null || c.v === undefined) return '';
    if (c.f !== null && c.f !== undefined) return String(c.f);
    return String(c.v);
  }));
  const headers = json.table.cols.map(c => c.label);
  return { headers, rows };
}

function buildTiles(rows) {
  const latest = rows[rows.length - 1];
  const prev   = rows.length > 1 ? rows[rows.length - 2] : null;

  const html = APPS.map((app, i) => {
    const cur   = rankLabel(latest[i + 1]);
    const pre   = prev ? rankLabel(prev[i + 1]) : null;
    const delta = prev ? deltaLabel(cur, pre) : null;

    const rankHtml = cur === '圏外'
      ? `<div class="tile-rank out">圏外</div>`
      : `<div class="tile-rank">${cur}<span style="font-size:17px;color:var(--text-sub);margin-left:4px;font-weight:500">位</span></div>`;

    const deltaHtml = delta
      ? `<div class="tile-delta ${delta.cls}">${delta.text}</div>`
      : `<div class="tile-delta delta-flat">前日比なし</div>`;

    return `<div class="tile">
      <div class="tile-name">${app.name}</div>
      ${rankHtml}
      ${deltaHtml}
    </div>`;
  }).join('');

  document.getElementById('tiles').innerHTML = html;
}

function buildChart(rows) {
  const recent = rows.slice(-30);
  const labels = recent.map(r => r[0].replace(/^\d{4}\//, ''));

  const datasets = APPS.map((app, i) => {
    const data = recent.map(r => {
      const v = parseInt(r[i + 1]);
      return isNaN(v) ? null : v;
    });
    return {
      label: app.name,
      data,
      borderColor: app.color,
      backgroundColor: app.color + '18',
      borderWidth: 2,
      pointRadius: data.map(v => v === null ? 0 : 3),
      pointHoverRadius: 6,
      tension: 0.3,
      spanGaps: true,
      segment: {
        borderDash: ctx => {
          const prev = ctx.p0.parsed.y;
          const next = ctx.p1.parsed.y;
          return (prev === null || next === null) ? [4, 4] : undefined;
        },
        borderColor: ctx => {
          const prev = ctx.p0.parsed.y;
          const next = ctx.p1.parsed.y;
          return (prev === null || next === null) ? app.color + '80' : app.color;
        },
      },
    };
  });

  const ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: {
          reverse: true,
          min: 1,
          ticks: {
            color: '#a0aec0',
            callback: v => v + '位',
            stepSize: 5,
          },
          grid: { color: 'rgba(226,232,240,0.8)' },
        },
        x: {
          ticks: { color: '#a0aec0', maxRotation: 45 },
          grid: { color: 'rgba(226,232,240,0.5)' },
        },
      },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: '#4a5568',
            boxWidth: 12,
            padding: 16,
            font: { size: 11 },
          },
        },
        tooltip: {
          backgroundColor: '#ffffff',
          borderColor: '#e2e8f0',
          borderWidth: 1,
          titleColor: '#1a202c',
          bodyColor: '#4a5568',
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y + '位' : '圏外'}`,
          },
        },
      },
    },
  });
}

function buildTable(rows) {
  const recent = [...rows].reverse().slice(0, 60);

  const thead = `<thead><tr>
    <th>日付</th>
    ${APPS.map(a => `<th><span class="dot" style="background:${a.color}"></span>${a.name}</th>`).join('')}
    <th>取得時刻</th>
  </tr></thead>`;

  const tbody = recent.map(r => {
    const cells = APPS.map((a, i) => {
      const v = rankLabel(r[i + 1]);
      return `<td class="${v === '圏外' ? 'rank-out' : ''}">${v === '圏外' ? '圏外' : v + '位'}</td>`;
    }).join('');
    return `<tr><td>${r[0]}</td>${cells}<td>${r[r.length - 1]}</td></tr>`;
  }).join('');

  document.getElementById('table').innerHTML = thead + `<tbody>${tbody}</tbody>`;
}

async function main() {
  try {
    const { headers, rows } = await loadData();
    if (!rows.length) throw new Error('データがありません');

    const latest = rows[rows.length - 1];
    document.getElementById('updated').textContent = `最終更新: ${latest[0]} ${latest[latest.length - 1]}`;

    buildTiles(rows);
    buildChart(rows);
    buildTable(rows, headers);
  } catch (e) {
    document.getElementById('tiles').innerHTML =
      `<div class="error-msg" style="grid-column:1/-1">⚠️ データ取得に失敗しました。スプレッドシートの共有設定を確認してください。<br><small>${e.message}</small></div>`;
    console.error(e);
  }
}

main();
</script>
</body>
</html>
