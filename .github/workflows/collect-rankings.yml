name: Google Play ランキング取得

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 UTC 00:00 = JST 09:00
  workflow_dispatch:        # 手動実行ボタンも有効

jobs:
  collect-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm install

      - name: Playwright (Chromium) をインストール
        run: npx playwright install chromium --with-deps

      - name: ランキングを取得してスプレッドシートに書き込み
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node src/collect.js

      - name: デバッグ画像をアップロード（失敗時のみ）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          if-no-files-found: ignore
