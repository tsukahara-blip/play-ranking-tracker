name: Google Play ランキング取得

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 UTC 00:00 = JST 09:00
  workflow_dispatch:        # 手動実行ボタンも有効

jobs:
  collect-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        run: npm install

      - name: ランキングを取得してスプレッドシートに書き込み
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node src/collect.js
